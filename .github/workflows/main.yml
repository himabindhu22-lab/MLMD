name: Automated ML Pipeline
on:
 push:
  branches:["main"]
  
jobs:
  run-preprocessing:
    runs-on: ubuntu-latest
 steps:
   - name: Checkout Repository Code
     uses: actions/checkout@v4
   - name: Set up Python
     uses: actions/checkout@v4
     with:
        python_version:'3.10'
   - name: install Dependencies
     run: python -m install --upgrade pip
          pip install pandas scikit-learn pytest
   - name: Execute Script
     run: python Example.py
  
